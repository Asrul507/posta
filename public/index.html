<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Posta POS - Cloud POS System</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Chart.js CDN -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-gray-100 font-sans antialiased text-gray-800">
    <div id="app-container" class="min-h-screen flex flex-col">
        <!-- Komponen akan dimuat secara dinamis oleh loader.js -->
        <div id="auth-container"></div>
        <div id="main-layout" class="hidden flex-1 flex flex-col">
            <div id="header-container"></div>
            <div class="flex-1 flex overflow-hidden">
                <div id="sidebar-container"></div>
                <main id="content-container" class="flex-1 overflow-y-auto bg-gray-50"></main>
            </div>
        </div>
    </div>

    <!-- Modals Container -->
    <div id="modals-container"></div>

    <!-- Core App Scripts -->
    <script type="module" src="js/app.js"></script>
</body>
</html>
