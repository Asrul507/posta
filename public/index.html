<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Posta POS - Cloud POS System</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Chart.js CDN -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <!-- ZXing (Barcode Scanner Kamera) -->
    <script src="https://unpkg.com/@zxing/library@0.20.0"></script>
    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-gray-100 font-sans antialiased text-gray-800 h-screen flex flex-col overflow-hidden">
    
    <!-- Login Screen Container -->
    <div id="auth-container"></div>

    <!-- Main Application Layout -->
    <div id="main-layout" class="hidden h-screen flex flex-col">
        <header id="header-container" class="flex-shrink-0 bg-white border-b"></header>
        
        <div class="flex-1 flex overflow-hidden">
            <aside id="sidebar-container" class="w-64 flex-shrink-0 bg-white border-r hidden md:block"></aside>
            
            <main id="content-container" class="flex-1 overflow-y-auto bg-gray-50">
                <div id="view-pos" class="hidden h-full"></div>
                <div id="view-products" class="hidden"></div>
                <div id="view-po" class="hidden"></div>
                <div id="view-reports" class="hidden"></div>
                <div id="view-admin" class="hidden"></div>
            </main>
        </div>
    </div>

    <!-- Global Modals Container -->
    <div id="modals-container"></div>

    <!-- Toast Notification Container -->
    <div id="toast-container" class="fixed top-4 right-4 z-[9999] flex flex-col gap-2 pointer-events-none"></div>

    <!-- Main Module Script -->
    <script type="module" src="js/app.js"></script>
</body>
</html>
