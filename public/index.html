<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Posta POS</title>
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#0f172a">
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <script src="https://unpkg.com/@zxing/library@latest/umd/index.min.js"></script>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen">

  <!-- Container Login -->
  <div id="login-container"></div>

  <!-- Main App Layout -->
  <div id="app" style="display: none;" class="min-h-screen flex flex-col">
    <!-- Header -->
    <div id="header-container"></div>

    <div class="flex-1 flex overflow-hidden">
      <!-- Sidebar Navigation -->
      <div id="sidebar-container"></div>

      <!-- Main Views -->
      <main class="flex-1 overflow-y-auto p-4 md:p-6 bg-slate-900">
        <div id="view-pos-container" class="view-panel"></div>
        <div id="view-products-container" class="view-panel"></div>
        <div id="view-history-container" class="view-panel"></div>
        <div id="view-reports-container" class="view-panel"></div>
        <div id="view-employees-container" class="view-panel"></div>
        <div id="view-admin-container" class="view-panel"></div>
      </main>
    </div>
  </div>

  <!-- Global Modals -->
  <div id="modals-container"></div>

  <!-- Toast Notification -->
  <div id="toast" class="toast"></div>

  <!-- Audio Elements -->
  <audio id="beep-sound" preload="auto" src="data:audio/wav;base64,UklGRl9vT19XQVZFZm10IBAAAAABAAEAQB8AAEAfAAABAAgAZGF0YU"></audio>

  <!-- Service Worker Registration -->
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/sw.js')
          .then(() => console.log('SW Registered'))
          .catch(err => console.warn('SW Fail:', err));
      });
    }
  </script>

  <!-- Script Aplikasi (Wajib type="module") -->
  <script type="module" src="/js/app.js"></script>
</body>
</html>
