<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Posta POS - Cloud POS System</title>
  
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  
  <!-- Posta Essential & Layout CSS (Embedded) -->
  <style>
    /* Reset & Base */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background-color: #f1f5f9; color: #1e293b; line-height: 1.5; }
    
    /* Layout */
    body { display: flex; flex-direction: column; overflow: hidden; }
    #header-root { width: 100%; flex-shrink: 0; z-index: 20; }
    .app-layout { display: flex; flex: 1; overflow: hidden; position: relative; }
    #sidebar-root { z-index: 30; }
    .main-content { flex: 1; overflow-y: auto; padding: 1.5rem; background-color: #f8fafc; position: relative; }

    /* Visibility Utilities */
    .hidden { display: none !important; }
    .app-view { width: 100%; max-width: 1200px; margin: 0 auto; }

    /* Cards & Containers */
    .card { background: #ffffff; border-radius: 0.75rem; border: 1px solid #e2e8f0; box-shadow: 0 1px 3px 0 rgba(0, 0, 0, 0.05); padding: 1.25rem; margin-bottom: 1.5rem; }
    .view-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 1.5rem; }
    .subtitle { color: #64748b; font-size: 0.875rem; margin-top: 0.25rem; }

    /* Buttons */
    .btn { display: inline-flex; align-items: center; justify-content: center; font-weight: 500; font-size: 0.875rem; padding: 0.5rem 1rem; border-radius: 0.5rem; cursor: pointer; border: 1px solid transparent; transition: all 0.2s; text-decoration: none; }
    .btn:hover { opacity: 0.9; }
    .btn-primary { background-color: #2563eb; color: #ffffff; }
    .btn-secondary { background-color: #ffffff; border-color: #cbd5e1; color: #334155; }
    .btn-secondary:hover { background-color: #f1f5f9; }
    .btn-outline { background-color: transparent; border-color: #cbd5e1; color: #334155; }
    .btn-outline:hover { background-color: #f8fafc; }
    .btn-sm { padding: 0.25rem 0.5rem; font-size: 0.75rem; border-radius: 0.375rem; }

    /* Tables */
    .table-container { width: 100%; overflow-x: auto; }
    .data-table { width: 100%; border-collapse: collapse; text-align: left; font-size: 0.875rem; }
    .data-table th { background-color: #f8fafc; color: #475569; font-weight: 600; padding: 0.75rem 1rem; border-bottom: 1px solid #e2e8f0; text-transform: uppercase; font-size: 0.75rem; letter-spacing: 0.05em; }
    .data-table td { padding: 0.875rem 1rem; border-bottom: 1px solid #f1f5f9; vertical-align: middle; }
    .data-table tr:hover td { background-color: #f8fafc; }
    .text-right { text-align: right; }
    .text-center { text-align: center; }

    /* Badges */
    .badge { display: inline-flex; align-items: center; padding: 0.125rem 0.5rem; border-radius: 9999px; font-size: 0.75rem; font-weight: 600; }
    .badge-info { background-color: #e0e7ff; color: #3730a3; }
    .badge-success { background-color: #dcfce7; color: #166534; }
    .badge-danger { background-color: #fee2e2; color: #991b1b; }

    /* Modals & Backdrop */
    .modal-backdrop { position: fixed; inset: 0; background-color: rgba(15, 23, 42, 0.6); display: flex; align-items: center; justify-content: center; z-index: 9999; padding: 1rem; }
    .modal-box { background: #ffffff; border-radius: 0.75rem; max-width: 500px; width: 100%; max-height: 90vh; overflow-y: auto; box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1); padding: 1.5rem; }
    .modal-lg { max-width: 800px; }
    .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem; }
    .modal-header h3 { font-size: 1.125rem; font-weight: 600; color: #0f172a; }
    .btn-close { background: none; border: none; font-size: 1.5rem; color: #94a3b8; cursor: pointer; }
    .modal-footer { display: flex; justify-content: flex-end; gap: 0.5rem; margin-top: 1.5rem; }

    /* Form Controls */
    .form-group { margin-bottom: 1rem; }
    .form-group label { display: block; font-size: 0.875rem; font-weight: 500; color: #334155; margin-bottom: 0.375rem; }
    .form-control { width: 100%; padding: 0.5rem 0.75rem; border: 1px solid #cbd5e1; border-radius: 0.375rem; font-size: 0.875rem; }
    .form-control:focus { outline: 2px solid #2563eb; border-color: transparent; }
    .form-row { display: flex; gap: 1rem; }
    .form-row .col { flex: 1; }
    .input-disabled { background-color: #f1f5f9; color: #64748b; }

    /* Sidebar Drawer Styles */
    .sidebar { width: 260px; background: #ffffff; border-right: 1px solid #e2e8f0; height: 100%; display: flex; flex-direction: column; transition: transform 0.3s; }
    @media (max-width: 768px) {
      .sidebar { position: absolute; top: 0; bottom: 0; left: 0; transform: translateX(-100%); z-index: 40; box-shadow: 0 10px 15px -3px rgba(0,0,0,0.1); }
      .sidebar.active { transform: translateX(0); }
    }
  </style>
</head>
<body>

  <!-- Header Root -->
  <div id="header-root"></div>

  <!-- Main App Layout Wrapper -->
  <div class="app-layout">
    <!-- Sidebar Root -->
    <div id="sidebar-root"></div>

    <!-- Main Content Area -->
    <main id="main-content" class="main-content">
      <div id="view-admin" class="app-view hidden"></div>
      <div id="view-pos" class="app-view hidden"></div>
      <div id="view-products" class="app-view hidden"></div>
      <div id="view-history" class="app-view hidden"></div>
      <div id="view-reports" class="app-view hidden"></div>
    </main>
  </div>

  <!-- Modals & Login Root -->
  <div id="modals-root"></div>
  <div id="login-root"></div>

  <!-- App Entry Script -->
  <script type="module" src="/js/app.js"></script>
</body>
</html>
