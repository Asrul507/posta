<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Posta POS - Cloud System</title>
  
  <!-- Tailwind CSS & FontAwesome -->

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body class="bg-slate-100 text-slate-800 antialiased h-screen overflow-hidden flex flex-col font-sans">

  <!-- Header Root -->
  <div id="header-root" class="w-full z-20 flex-shrink-0"></div>

  <!-- Layout Tengah -->
  <div class="flex flex-1 overflow-hidden relative">
    
    <!-- Sidebar Root -->
    <div id="sidebar-root" class="z-30"></div>

    <!-- Main Views Container -->
    <main id="main-content" class="flex-1 overflow-y-auto p-4 md:p-6 relative bg-slate-50">
      <div id="view-admin" class="app-view hidden"></div>
      <div id="view-pos" class="app-view hidden"></div>
      <div id="view-products" class="app-view hidden"></div>
      <div id="view-history" class="app-view hidden"></div>
      <div id="view-reports" class="app-view hidden"></div>
    </main>
  </div>

  <!-- Modals & Login Container -->
  <div id="modals-root"></div>
  <div id="login-root"></div>

  <!-- Audio Alerts (Opsional) -->
  <audio id="snd-beep" src="/audio/beep.mp3" preload="auto"></audio>

  <!-- App Entry Script -->
  <script type="module" src="/js/app.js"></script>
</body>
</html>
