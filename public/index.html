<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>POS Kasir Ritel</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 text-slate-800 antialiased h-screen flex flex-col overflow-hidden">

  <!-- TOP HEADER -->
  <header class="bg-white border-b border-slate-200 px-4 py-3 flex items-center justify-between shrink-0">
    <div class="flex items-center gap-2">
      <div class="w-8 h-8 rounded-lg bg-emerald-600 flex items-center justify-center text-white font-bold">K</div>
      <div>
        <h1 class="font-bold text-sm leading-none">Toko Berkah</h1>
        <span class="text-xs text-slate-500">Kasir 01 &bull; Mode Ritel</span>
      </div>
    </div>
    <button class="text-xs bg-slate-100 border border-slate-300 font-medium px-2.5 py-1.5 rounded-lg hover:bg-slate-200">
      Riwayat
    </button>
  </header>

  <!-- MAIN CONTAINER (SPLIT SCREEN DI TABLET/PC, 1 KOLOM DI HP) -->
  <div class="flex-1 flex overflow-hidden">

    <!-- SISI KIRI: SEARCH, KATEGORI & GRID PRODUK -->
    <main class="flex-1 flex flex-col overflow-hidden">
      
      <!-- SEARCH & SCAN BARCODE -->
      <div class="p-3 bg-white border-b border-slate-200 flex gap-2 shrink-0">
        <div class="relative flex-1">
          <input 
            type="text" 
            placeholder="Cari barang / ketik barcode..." 
            class="w-full pl-9 pr-3 py-2 text-sm bg-slate-50 border border-slate-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-emerald-500 focus:bg-white"
          />
          <svg class="w-4 h-4 absolute left-3 top-3 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg>
        </div>
        <button class="bg-slate-800 hover:bg-slate-900 text-white px-3 py-2 rounded-xl flex items-center gap-1.5 text-xs font-medium">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v1m6 11h2m-6 0h-2v4m0-11v3m0 0h.01M12 12h4.01M16 20h4M4 12h4m12 0h.01M5 8h2a1 1 0 001-1V5a1 1 0 00-1-1H5a1 1 0 00-1 1v2a1 1 0 001 1zm12 0h2a1 1 0 001-1V5a1 1 0 00-1-1h-2a1 1 0 00-1 1v2a1 1 0 001 1zM5 20h2a1 1 0 001-1v-2a1 1 0 00-1-1H5a1 1 0 00-1 1v2a1 1 0 001 1z"/></svg>
          Scan
        </button>
      </div>

      <!-- FILTER KATEGORI (HORIZONTAL SCROLL) -->
      <div class="flex gap-2 p-3 overflow-x-auto bg-white border-b border-slate-200 shrink-0 no-scrollbar">
        <button class="px-3 py-1.5 rounded-lg text-xs font-semibold bg-emerald-600 text-white shrink-0">Semua</button>
        <button class="px-3 py-1.5 rounded-lg text-xs font-medium bg-slate-100 text-slate-600 hover:bg-slate-200 shrink-0">Sembako</button>
        <button class="px-3 py-1.5 rounded-lg text-xs font-medium bg-slate-100 text-slate-600 hover:bg-slate-200 shrink-0">Minuman</button>
        <button class="px-3 py-1.5 rounded-lg text-xs font-medium bg-slate-100 text-slate-600 hover:bg-slate-200 shrink-0">Snack</button>
        <button class="px-3 py-1.5 rounded-lg text-xs font-medium bg-slate-100 text-slate-600 hover:bg-slate-200 shrink-0">Rokok</button>
      </div>

      <!-- GRID DAFTAR PRODUK (SCROLLABLE) -->
      <div class="flex-1 p-3 overflow-y-auto pb-24 md:pb-3">
        <div class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-3 lg:grid-cols-4 gap-2.5">
          
          <!-- Card Produk 1 -->
          <button class="p-3 bg-white rounded-xl border border-slate-200 shadow-sm text-left hover:border-emerald-500 active:scale-95 transition-all flex flex-col justify-between">
            <div>
              <span class="text-xs font-semibold text-slate-400 block">SEM-01</span>
              <h2 class="font-medium text-sm text-slate-800 line-clamp-2 mt-0.5">Minyak Goreng 1L</h2>
            </div>
            <div class="mt-3 flex items-center justify-between">
              <span class="font-bold text-sm text-emerald-600">Rp 17.500</span>
              <span class="text-[11px] bg-slate-100 text-slate-500 px-1.5 py-0.5 rounded">Stok: 24</span>
            </div>
          </button>

          <!-- Card Produk 2 -->
          <button class="p-3 bg-white rounded-xl border border-slate-200 shadow-sm text-left hover:border-emerald-500 active:scale-95 transition-all flex flex-col justify-between">
            <div>
              <span class="text-xs font-semibold text-slate-400 block">MIN-03</span>
              <h2 class="font-medium text-sm text-slate-800 line-clamp-2 mt-0.5">Air Mineral 600ml</h2>
            </div>
            <div class="mt-3 flex items-center justify-between">
              <span class="font-bold text-sm text-emerald-600">Rp 3.500</span>
              <span class="text-[11px] bg-slate-100 text-slate-500 px-1.5 py-0.5 rounded">Stok: 120</span>
            </div>
          </button>

          <!-- Card Produk 3 -->
          <button class="p-3 bg-white rounded-xl border border-slate-200 shadow-sm text-left hover:border-emerald-500 active:scale-95 transition-all flex flex-col justify-between">
            <div>
              <span class="text-xs font-semibold text-slate-400 block">SNK-05</span>
              <h2 class="font-medium text-sm text-slate-800 line-clamp-2 mt-0.5">Biskuit Cokelat Roma</h2>
            </div>
            <div class="mt-3 flex items-center justify-between">
              <span class="font-bold text-sm text-emerald-600">Rp 8.000</span>
              <span class="text-[11px] bg-slate-100 text-slate-500 px-1.5 py-0.5 rounded">Stok: 15</span>
            </div>
          </button>

          <!-- Card Produk 4 -->
          <button class="p-3 bg-white rounded-xl border border-slate-200 shadow-sm text-left hover:border-emerald-500 active:scale-95 transition-all flex flex-col justify-between">
            <div>
              <span class="text-xs font-semibold text-slate-400 block">SEM-02</span>
              <h2 class="font-medium text-sm text-slate-800 line-clamp-2 mt-0.5">Beras Pulen 5kg</h2>
            </div>
            <div class="mt-3 flex items-center justify-between">
              <span class="font-bold text-sm text-emerald-600">Rp 72.000</span>
              <span class="text-[11px] bg-slate-100 text-slate-500 px-1.5 py-0.5 rounded">Stok: 8</span>
            </div>
          </button>

        </div>
      </div>
    </main>

    <!-- SISI KANAN: KERANJANG PERMANEN (HANYA TAMPIL DI TABLET / MD KE ATAS) -->
    <aside class="hidden md:flex md:w-80 lg:w-96 bg-white border-l border-slate-200 flex-col justify-between shrink-0">
      
      <!-- Cart Header -->
      <div class="p-4 border-b border-slate-200 flex items-center justify-between">
        <h2 class="font-bold text-slate-800">Keranjang Belanja</h2>
        <button class="text-xs text-rose-500 font-semibold hover:underline">Kosongkan</button>
      </div>

      <!-- Cart Item List -->
      <div class="flex-1 p-3 overflow-y-auto space-y-2">
        <div class="p-2.5 rounded-xl border border-slate-200 flex items-center justify-between bg-slate-50">
          <div class="flex-1 pr-2">
            <h3 class="text-xs font-semibold text-slate-800">Minyak Goreng 1L</h3>
            <span class="text-xs text-emerald-600 font-bold">Rp 17.500</span>
          </div>
          <div class="flex items-center gap-1.5">
            <button class="w-6 h-6 rounded bg-slate-200 text-xs font-bold hover:bg-slate-300">-</button>
            <span class="text-xs font-bold w-5 text-center">2</span>
            <button class="w-6 h-6 rounded bg-slate-200 text-xs font-bold hover:bg-slate-300">+</button>
          </div>
        </div>
      </div>

      <!-- Cart Checkout Section -->
      <div class="p-4 border-t border-slate-200 bg-slate-50 space-y-3">
        <div class="flex justify-between items-center text-xs text-slate-600">
          <span>Subtotal (2 Item)</span>
          <span class="font-semibold text-slate-800">Rp 35.000</span>
        </div>
        <div class="flex justify-between items-center font-bold text-base text-slate-900 border-t border-slate-200 pt-2">
          <span>Total</span>
          <span class="text-emerald-600">Rp 35.000</span>
        </div>
        <button class="w-full py-3 bg-emerald-600 hover:bg-emerald-700 active:scale-98 text-white font-bold rounded-xl shadow-sm text-sm">
          Bayar (F12)
        </button>
      </div>
    </aside>

  </div>

  <!-- FLOATING CART BAR (KHUSUS TAMPIL DI HP / DI BAWAH MD) -->
  <div class="md:hidden fixed bottom-0 left-0 right-0 p-3 bg-white/95 backdrop-blur border-t border-slate-200 flex items-center justify-between gap-3 shadow-lg">
    <div>
      <span class="text-[11px] text-slate-500 block">2 Item terpilih</span>
      <span class="text-base font-extrabold text-emerald-600">Rp 35.000</span>
    </div>
    <button class="flex-1 py-2.5 px-4 bg-emerald-600 hover:bg-emerald-700 text-white font-bold rounded-xl text-sm text-center">
      Lihat Keranjang & Bayar
    </button>
  </div>

</body>
</html>
