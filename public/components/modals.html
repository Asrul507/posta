<!-- Modal Template Container -->
<div id="modal-container">
  <!-- Modal Tambah / Edit Produk -->
  <div id="modal-product" class="modal-backdrop hidden">
    <div class="modal-box">
      <div class="modal-header">
        <h3 id="modal-product-title">Tambah Produk</h3>
        <button type="button" class="btn-close" onclick="window.closeModal('modal-product')">&times;</button>
      </div>
      <form id="form-product" onsubmit="window.handleProductSubmit(event)">
        <input type="hidden" id="product-id" />
        <div class="form-group">
          <label>Nama Produk</label>
          <input type="text" id="product-name" required class="form-control" placeholder="Nama item" />
        </div>
        <div class="form-group">
          <label>SKU / Barcode</label>
          <input type="text" id="product-sku" class="form-control" placeholder="Opsional / Scan barcode" />
        </div>
        <div class="form-row">
          <div class="form-group col">
            <label>Harga Jual</label>
            <input type="number" id="product-price" required min="0" class="form-control" />
          </div>
          <div class="form-group col">
            <label>Harga Pokok (Modal)</label>
            <input type="number" id="product-cost" min="0" class="form-control" />
          </div>
        </div>
        <div class="form-group">
          <label>Stok Awal</label>
          <input type="number" id="product-stock" min="0" value="0" class="form-control" />
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" onclick="window.closeModal('modal-product')">Batal</button>
          <button type="submit" class="btn btn-primary">Simpan Produk</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Modal Stock Adjustment (Opname) -->
  <div id="modal-stock-adjust" class="modal-backdrop hidden">
    <div class="modal-box">
      <div class="modal-header">
        <h3 id="adjust-modal-title">Penyesuaian Stok</h3>
        <button type="button" class="btn-close" onclick="window.closeModal('modal-stock-adjust')">&times;</button>
      </div>
      <form id="form-stock-adjust" onsubmit="window.handleStockAdjustSubmit(event)">
        <input type="hidden" id="adjust-product-id" />
        
        <div class="form-group">
          <label>Stok Saat Ini di Sistem</label>
          <input type="text" id="adjust-current-stock" readonly class="input-disabled form-control" />
        </div>

        <div class="form-group">
          <label>Jenis Penyesuaian</label>
          <select id="adjust-type" class="form-control">
            <option value="ADD">Tambah Stok (+ Masuk)</option>
            <option value="SUBTRACT">Kurangi Stok (- Rusak/Hilang)</option>
            <option value="SET">Koreksi Sesuai Fisik (Opname)</option>
          </select>
        </div>

        <div class="form-group">
          <label id="adjust-qty-label">Jumlah / Nilai Fisik</label>
          <input type="number" id="adjust-qty" min="0" required class="form-control" placeholder="Masukkan angka" />
        </div>

        <div class="form-group">
          <label>Keterangan / Alasan</label>
          <input type="text" id="adjust-reason" placeholder="Contoh: Selisih opname fisik, barang rusak" required class="form-control" />
        </div>

        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" onclick="window.closeModal('modal-stock-adjust')">Batal</button>
          <button type="submit" class="btn btn-primary">Simpan Perubahan</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Modal Stock History (Kartu Riwayat Stok) -->
  <div id="modal-stock-history" class="modal-backdrop hidden">
    <div class="modal-box modal-lg">
      <div class="modal-header">
        <h3 id="history-modal-title">Riwayat Mutasi Stok</h3>
        <button type="button" class="btn-close" onclick="window.closeModal('modal-stock-history')">&times;</button>
      </div>
      <div class="modal-body">
        <div class="table-container">
          <table class="data-table">
            <thead>
              <tr>
                <th>Waktu</th>
                <th>Tipe</th>
                <th>Perubahan</th>
                <th>Sisa Stok</th>
                <th>Keterangan</th>
              </tr>
            </thead>
            <tbody id="stock-history-tbody">
              <!-- Data log stok dimasukkan via JS -->
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </div>
</div>
