<div class="view-container">
  <div class="view-header">
    <div class="view-title">
      <h2>Daftar Produk & Inventaris</h2>
      <p class="subtitle">Kelola stok, harga, dan riwayat pergerakan barang</p>
    </div>
    <div class="view-actions">
      <button class="btn btn-primary" onclick="window.openProductModal ? window.openProductModal() : null">
        + Tambah Produk
      </button>
    </div>
  </div>

  <div class="card">
    <div class="table-container">
      <table class="data-table">
        <thead>
          <tr>
            <th>SKU</th>
            <th>Nama Produk</th>
            <th>Harga Modal</th>
            <th>Harga Jual</th>
            <th>Stok</th>
            <th class="text-right">Aksi</th>
          </tr>
        </thead>
        <tbody id="product-table-body">
          <!-- Diisi otomatis oleh renderProductTable() -->
        </tbody>
      </table>
    </div>
  </div>
</div>
