<div id="view-products" class="flex-1 hidden flex-col bg-slate-50 p-3 sm:p-4 overflow-hidden pb-20 md:pb-4">
  <div class="bg-white rounded-2xl border border-slate-200 flex-1 flex flex-col overflow-hidden shadow-sm">
    <div class="p-3 sm:p-4 border-b border-slate-200 flex flex-col sm:flex-row justify-between items-start sm:items-center gap-2.5">
      <div>
        <h2 class="font-bold text-slate-800 text-sm sm:text-base flex items-center gap-2">
          <i class="fa-solid fa-boxes-stacked text-emerald-600"></i>
          <span>Daftar Master Produk</span>
        </h2>
        <span class="text-[11px] text-slate-500">Seluruh katalog barang dan sisa stok aktif di database</span>
      </div>
      <div class="flex items-center gap-2 w-full sm:w-auto">
        <div class="relative flex-1 sm:w-64">
          <input 
            type="text" 
            id="prod-table-search" 
            oninput="window.renderProductTable()" 
            placeholder="Filter nama / barcode..." 
            class="w-full pl-8 pr-3 py-1.5 text-xs bg-slate-100 border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-emerald-500"
          />
          <i class="fa-solid fa-magnifying-glass absolute left-2.5 top-2.5 text-slate-400 text-[10px]"></i>
        </div>
        <button onclick="window.openAddProductModal('MASTER')" class="shrink-0 px-3 py-1.5 bg-emerald-600 hover:bg-emerald-700 text-white rounded-xl text-xs font-bold flex items-center gap-1.5 shadow-sm">
          <i class="fa-solid fa-plus"></i>
          <span class="hidden sm:inline">Tambah Produk</span>
        </button>
      </div>
    </div>

    <div class="flex-1 overflow-auto p-3 sm:p-4">
      <table class="w-full text-left text-xs border-collapse">
        <thead>
          <tr class="border-b border-slate-200 bg-slate-50 text-[10px] uppercase text-slate-500 font-bold">
            <th class="py-2.5 px-3">Barcode</th>
            <th class="py-2.5 px-3">Nama Produk</th>
            <th class="py-2.5 px-3">Kategori</th>
            <th class="py-2.5 px-3 text-right">Harga Modal</th>
            <th class="py-2.5 px-3 text-right">Harga Jual</th>
            <th class="py-2.5 px-3 text-center">Stok</th>
            <th class="py-2.5 px-3 text-center">Aksi</th>
          </tr>
        </thead>
        <tbody id="master-products-tbody" class="divide-y divide-slate-100">
          <tr><td colspan="7" class="text-center py-8 text-slate-400">Memuat data produk...</td></tr>
        </tbody>
      </table>
    </div>
  </div>
</div>

<!-- MODAL TAMBAH / EDIT PRODUK -->
<div id="product-modal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-[210] hidden flex items-center justify-center p-4">
  <div class="bg-white rounded-2xl max-w-md w-full p-5 shadow-2xl space-y-4 max-h-[90vh] overflow-y-auto">
    <div class="flex items-center justify-between border-b border-slate-100 pb-3">
      <h3 id="product-modal-title" class="font-bold text-slate-800 text-sm">Tambah Produk Baru</h3>
      <button type="button" onclick="window.closeProductModal()" class="text-slate-400 hover:text-slate-600 text-lg">
        <i class="fa-solid fa-xmark"></i>
      </button>
    </div>

    <form onsubmit="event.preventDefault(); window.submitProductForm();" class="space-y-3 text-xs">
      <div>
        <label class="font-bold text-slate-500 uppercase tracking-wider block mb-1">Barcode (Opsional)</label>
        <input id="product-barcode-input" type="text" placeholder="Kosongkan jika tidak ada" class="w-full bg-slate-50 border border-slate-200 rounded-xl p-2.5 text-slate-800 font-mono focus:outline-none focus:border-emerald-500" />
      </div>
      <div>
        <label class="font-bold text-slate-500 uppercase tracking-wider block mb-1">Nama Produk</label>
        <input id="product-name-input" type="text" required placeholder="Contoh: Indomie Goreng" class="w-full bg-slate-50 border border-slate-200 rounded-xl p-2.5 text-slate-800 focus:outline-none focus:border-emerald-500" />
      </div>
      <div>
        <label class="font-bold text-slate-500 uppercase tracking-wider block mb-1">Kategori</label>
        <input id="product-category-input" type="text" placeholder="Contoh: Makanan Instan" class="w-full bg-slate-50 border border-slate-200 rounded-xl p-2.5 text-slate-800 focus:outline-none focus:border-emerald-500" />
      </div>
      <div class="grid grid-cols-2 gap-3">
        <div>
          <label class="font-bold text-slate-500 uppercase tracking-wider block mb-1">Harga Modal</label>
          <input id="product-cost-input" type="number" min="0" step="1" placeholder="0" class="w-full bg-slate-50 border border-slate-200 rounded-xl p-2.5 text-slate-800 focus:outline-none focus:border-emerald-500" />
        </div>
        <div>
          <label class="font-bold text-slate-500 uppercase tracking-wider block mb-1">Harga Jual</label>
          <input id="product-price-input" type="number" min="0" step="1" placeholder="0" class="w-full bg-slate-50 border border-slate-200 rounded-xl p-2.5 text-slate-800 focus:outline-none focus:border-emerald-500" />
        </div>
      </div>
      <div class="grid grid-cols-2 gap-3">
        <div>
          <label class="font-bold text-slate-500 uppercase tracking-wider block mb-1">Stok Awal</label>
          <input id="product-stock-input" type="number" min="0" step="1" value="0" class="w-full bg-slate-50 border border-slate-200 rounded-xl p-2.5 text-slate-800 focus:outline-none focus:border-emerald-500" />
        </div>
        <div>
          <label class="font-bold text-slate-500 uppercase tracking-wider block mb-1">Satuan</label>
          <input id="product-unit-input" type="text" value="pcs" placeholder="pcs / kg / dus" class="w-full bg-slate-50 border border-slate-200 rounded-xl p-2.5 text-slate-800 focus:outline-none focus:border-emerald-500" />
        </div>
      </div>

      <div class="pt-2 flex gap-2">
        <button id="product-delete-btn" type="button" onclick="window.deleteProduct()" class="hidden px-3 py-2.5 bg-rose-50 hover:bg-rose-100 text-rose-600 font-bold rounded-xl text-xs border border-rose-200">
          <i class="fa-solid fa-trash"></i>
        </button>
        <button type="button" onclick="window.closeProductModal()" class="w-1/3 py-2.5 bg-slate-100 hover:bg-slate-200 font-bold rounded-xl text-xs text-slate-700">Batal</button>
        <button id="btn-save-product" type="submit" class="flex-1 py-2.5 bg-emerald-600 hover:bg-emerald-700 text-white font-bold rounded-xl text-xs shadow flex items-center justify-center gap-1.5">
          <i class="fa-solid fa-check"></i>
          <span>Simpan Produk</span>
        </button>
      </div>
    </form>
  </div>
</div>
