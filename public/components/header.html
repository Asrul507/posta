<header class="bg-white border-b border-slate-200 px-4 py-2.5 flex items-center justify-between shrink-0 shadow-sm z-30">
  <div class="flex items-center gap-3">
    <button onclick="window.toggleSidebar(true)" class="w-9 h-9 rounded-xl bg-slate-100 hover:bg-slate-200 flex items-center justify-center text-slate-700 text-sm transition">
      <i class="fa-solid fa-bars"></i>
    </button>
    <div>
      <h1 id="page-title" class="font-bold text-sm leading-tight text-slate-900">Posta POS</h1>
      <span class="text-[11px] text-slate-500 font-medium">Sistem Kasir</span>
    </div>
  </div>

  <div class="flex items-center gap-2">
    <button onclick="window.switchView('POS')" id="header-back-pos-btn" class="hidden px-3 py-1.5 rounded-xl bg-emerald-600 text-white text-xs font-bold transition flex items-center gap-1.5 shadow-sm">
      <i class="fa-solid fa-cart-shopping"></i>
      <span>Ke Kasir</span>
    </button>
  </div>
</header>
