<header class="bg-white border-b border-slate-200 px-4 py-2.5 flex items-center justify-between shrink-0 shadow-sm z-30">
  <div class="flex items-center gap-3">
    <button onclick="window.toggleSidebar(true)" class="p-2 hover:bg-slate-100 rounded-xl text-slate-700 transition">
      <i class="fa-solid fa-bars text-lg"></i>
    </button>
    <div>
      <h1 id="page-title" class="font-extrabold text-sm sm:text-base text-slate-900 leading-tight">Posta POS</h1>
      <div class="flex items-center gap-2 text-[11px] text-slate-500 font-medium">
        <span id="header-store-name" class="font-bold text-slate-700">Toko</span>
        <span>•</span>
        <span id="header-user-info" class="text-slate-600">Kasir</span>
        <span>•</span>
        <span id="header-shift-badge" class="px-2 py-0.5 rounded-md bg-amber-100 text-amber-800 font-bold text-[10px]">Shift Belum Buka</span>
      </div>
    </div>
  </div>

  <div class="flex items-center gap-2">
    <!-- Indikator Scanner Cepat -->
    <button onclick="window.openContinuousCamera('CASHIER')" class="hidden sm:flex items-center gap-1.5 px-3 py-1.5 bg-slate-100 hover:bg-slate-200 text-slate-700 rounded-xl text-xs font-bold transition">
      <i class="fa-solid fa-barcode text-emerald-600"></i>
      <span>Scan Kamera</span>
    </button>
    <button id="btn-open-shift-header" onclick="window.postaShifts?.openModalOpenShift()" class="hidden px-3 py-1.5 bg-emerald-50 hover:bg-emerald-100 text-emerald-700 border border-emerald-200 rounded-xl text-xs font-bold transition flex items-center gap-1.5">
      <i class="fa-solid fa-cash-register"></i>
      <span class="hidden sm:inline">Buka Shift</span>
    </button>
    <button id="btn-close-shift-header" onclick="window.openCloseShiftModal()" class="px-3 py-1.5 bg-amber-50 hover:bg-amber-100 text-amber-700 border border-amber-200 rounded-xl text-xs font-bold transition flex items-center gap-1.5">
      <i class="fa-solid fa-clock-rotate-left"></i>
      <span class="hidden sm:inline">Tutup Shift</span>
    </button>
  </div>
</header>
