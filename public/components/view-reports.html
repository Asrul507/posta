<div class="p-6 space-y-6">
    <div class="flex items-center justify-between border-b pb-4">
        <div>
            <h1 class="text-2xl font-bold text-gray-800">Laporan & Analisis</h1>
            <p class="text-sm text-gray-500">Pantau performa penjualan, laba kotor, dan rekap shift kasir.</p>
        </div>
        <div class="flex gap-2">
            <button id="tab-btn-daily" onclick="window.postaReports.switchReportTab('daily')" class="px-4 py-2 bg-blue-600 text-white rounded-lg text-sm font-semibold shadow-sm transition">
                Laporan Harian (Z-Report)
            </button>
            <button id="tab-btn-monthly" onclick="window.postaReports.switchReportTab('monthly')" class="px-4 py-2 bg-gray-200 text-gray-700 hover:bg-gray-300 rounded-lg text-sm font-semibold transition">
                Laporan Bulanan & Grafik
            </button>
        </div>
    </div>

    <!-- TAB 1: Laporan Harian -->
    <div id="report-pane-daily" class="space-y-6">
        <div class="flex items-center gap-3">
            <label class="text-sm font-medium text-gray-700">Pilih Tanggal:</label>
            <input type="date" id="daily-report-date" class="px-3 py-2 border rounded-lg text-sm bg-white shadow-sm" onchange="window.postaReports.loadDailyReport()">
        </div>
        <div class="grid grid-cols-1 md:grid-cols-3 gap-6" id="daily-summary-cards"></div>
        <div class="bg-white rounded-xl border border-gray-200 shadow-sm p-4" id="daily-shifts-breakdown"></div>
    </div>

    <!-- TAB 2: Laporan Bulanan -->
    <div id="report-pane-monthly" class="hidden space-y-6">
        <div class="flex items-center gap-3">
            <label class="text-sm font-medium text-gray-700">Pilih Bulan & Tahun:</label>
            <input type="month" id="monthly-report-period" class="px-3 py-2 border rounded-lg text-sm bg-white shadow-sm" onchange="window.postaReports.loadMonthlyReport()">
        </div>

        <!-- GRAFIK / CHART BULANAN -->
        <div class="bg-white p-5 rounded-xl border border-gray-200 shadow-sm">
            <div class="flex items-center justify-between mb-4">
                <h3 class="font-semibold text-gray-800">Grafik Tren Penjualan & Laba Kotor</h3>
                <span class="text-xs text-gray-400">Omzet Penjualan vs Laba Kotor (Gross Profit)</span>
            </div>
            <div class="relative h-72 w-full">
                <canvas id="monthlyChart"></canvas>
            </div>
        </div>

        <!-- TABEL RINCIAN BULANAN -->
        <div class="bg-white rounded-xl border border-gray-200 shadow-sm overflow-hidden">
            <div class="p-4 border-b">
                <h3 class="font-semibold text-gray-800">Rincian Transaksi Harian</h3>
            </div>
            <div class="overflow-x-auto">
                <table class="w-full text-left text-sm text-gray-600">
                    <thead class="bg-gray-50 text-xs uppercase font-medium text-gray-400 border-b">
                        <tr>
                            <th class="px-4 py-3">Tanggal</th>
                            <th class="px-4 py-3">Jumlah Nota</th>
                            <th class="px-4 py-3">Omzet Penjualan</th>
                            <th class="px-4 py-3">HPP / Modal</th>
                            <th class="px-4 py-3">Estimasi Laba Kotor</th>
                        </tr>
                    </thead>
                    <tbody id="monthly-report-table" class="divide-y divide-gray-100"></tbody>
                </table>
            </div>
        </div>
    </div>
</div>
