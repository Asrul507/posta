<div id="view-admin-portal" class="fixed inset-0 bg-slate-900 z-[200] hidden flex flex-col text-slate-100 overflow-y-auto">
  <header class="bg-slate-950 border-b border-slate-800 px-6 py-4 flex items-center justify-between shrink-0">
    <div class="flex items-center gap-3">
      <div class="w-10 h-10 rounded-2xl bg-indigo-600 flex items-center justify-center text-white text-lg font-black shadow-lg">
        <i class="fa-solid fa-layer-group"></i>
      </div>
      <div>
        <h1 class="text-base font-extrabold text-white">Posta Management Hub</h1>
        <span class="text-xs text-indigo-400 font-medium">Developer & Multi-Tenant Control</span>
      </div>
    </div>
    <button onclick="window.openCreateTenantModal()" class="px-4 py-2.5 bg-indigo-600 hover:bg-indigo-700 text-white text-xs font-bold rounded-xl shadow-lg transition flex items-center gap-2">
      <i class="fa-solid fa-plus"></i>
      <span>Tambah Toko Baru</span>
    </button>
  </header>

  <main class="flex-1 max-w-6xl w-full mx-auto p-6 space-y-6">
    <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-3">
      <div>
        <h2 class="text-xl font-black text-white">Daftar Toko & Klien Aktif</h2>
        <p class="text-xs text-slate-400">Pilih toko yang ingin dibuka atau kelola inventarisnya</p>
      </div>
      <button onclick="window.loadAdminTenants()" class="px-3.5 py-1.5 bg-slate-800 hover:bg-slate-700 rounded-xl text-xs font-bold text-slate-300 flex items-center gap-1.5 self-start">
        <i class="fa-solid fa-rotate-right"></i>
        <span>Segarkan Data</span>
      </button>
    </div>

    <div id="admin-tenants-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
      <div class="col-span-full py-16 text-center text-slate-500 text-sm">
        <i class="fa-solid fa-spinner fa-spin text-2xl mb-2 block"></i>
        Memuat daftar toko...
      </div>
    </div>
  </main>
</div>
